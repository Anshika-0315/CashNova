<!DOCTYPE html>
<html>
  <body style="margin:0;padding:0;background:linear-gradient(135deg,#e0f7fa 0%,#f0f9ff 100%);font-family:'Segoe UI',Arial,sans-serif;">
    <div style="max-width:520px;margin:40px auto;background:#fff;border-radius:18px;box-shadow:0 6px 32px #1abc9c22,0 1.5px 8px #185a9d11;padding:40px 32px 32px 32px;overflow:hidden;">
      <div style="text-align:center;">
        
        <h2 style="margin:0 0 10px 0;font-size:2.1rem;letter-spacing:-1px;color:#185a9d;font-weight:800;">
          Thank You for Contacting <span style="color:#1abc9c;">CashNova</span>!
        </h2>
        <p style="font-size:1.15rem;margin:0 0 18px 0;color:#333;">
          Hi <b>{{ user_name }}</b>,
        </p>
      </div>
      <div style="margin:0 0 18px 0;">
        <p style="font-size:1.08rem;color:#185a9d;margin-bottom:10px;">
          <b>We have received your message and will get back to you soon.</b>
        </p>
        <div style="background:linear-gradient(90deg,#e0f7fa 60%,#f0f9ff 100%);border-radius:10px;padding:16px 18px;margin:18px 0;">
          <b style="color:#1abc9c;">Your message:</b>
          <div style="color:#185a9d;font-size:1.02rem;margin-top:8px;">
            {{ user_message|linebreaksbr }}
          </div>
        </div>
        <p style="margin-top:24px;font-size:1.05rem;color:#444;">
          If you have any further questions, just reply to this email.<br>
          <span style="color:#1abc9c;font-weight:600;">Happy budgeting!</span>
        </p>
      </div>
      <div style="margin-top:28px;text-align:center;color:#888;font-size:0.98em;">
        — Team <span style="color:#1abc9c;font-weight:600;">CashNova</span>
      </div>
      <div style="margin-top:18px;text-align:center;">
        <a href="https://cashnova.com" style="color:#185a9d;text-decoration:none;font-size:1.05rem;font-weight:500;">Visit Dashboard</a>
      </div>
    </div>
  </body>
</html>
